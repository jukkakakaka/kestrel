name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS
    # macos-14 已从公开 runner 池里退役；latest 指向当前可用的 macOS 镜像。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build, sign and smoke-test the bundle
        run: ./packaging/macos/build.sh --dmg

      - name: Zip the app for people who prefer that
        run: cd dist && ditto -c -k --keepParent Kestrel.app Kestrel-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Kestrel-macos
          path: |
            dist/Kestrel.app
            dist/Kestrel-*.dmg
            dist/Kestrel-macos.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-assets
          path: dist/Kestrel-*.dmg
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install
        run: |
          uv sync --extra desktop
          uv pip install pyinstaller

      - name: Build
        run: uv run pyinstaller packaging/pyinstaller/kestrel.spec --noconfirm

      - name: Smoke test
        shell: pwsh
        run: |
          # A frozen build can start and still serve a blank page when templates
          # are missing, so check a rendered page, not just the process.
          #
          # Three probes, cheapest first:
          #   1. `init` runs migrations — catches "the bundle cannot import itself";
          #   2. /healthz proves the server is up;
          #   3. /welcome proves templates render (it needs no market data).
          $env:KESTREL_HOME = "$env:RUNNER_TEMP\kestrel-smoke"
          $exe = "dist\Kestrel\Kestrel.exe"

          # The bundle is built as a windowed app (console=False), so PowerShell's
          # `&` returns before it finishes and $LASTEXITCODE stays $null. Use
          # Start-Process -Wait and read the real exit code.
          Write-Host "==> init"
          $init = Start-Process -FilePath $exe -ArgumentList "init" -Wait -PassThru `
                  -RedirectStandardOutput "$env:RUNNER_TEMP\init.log" `
                  -RedirectStandardError "$env:RUNNER_TEMP\init.err"
          Get-Content "$env:RUNNER_TEMP\init.log" -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\init.err" -ErrorAction SilentlyContinue
          if ($init.ExitCode -ne 0) { throw "kestrel init failed with exit code $($init.ExitCode)" }

          Write-Host "==> serve"
          $outLog = Join-Path $env:RUNNER_TEMP "kestrel-stdout.log"
          $errLog = Join-Path $env:RUNNER_TEMP "kestrel-stderr.log"
          $p = Start-Process -FilePath $exe -ArgumentList "serve","--port","8399" `
                -PassThru -RedirectStandardOutput $outLog -RedirectStandardError $errLog

          $healthy = $false
          foreach ($i in 1..60) {
            Start-Sleep -Milliseconds 500
            if ($p.HasExited) { break }
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 "http://127.0.0.1:8399/healthz"
              if ($r.StatusCode -eq 200) { $healthy = $true; break }
            } catch { }
          }

          $rendered = $false
          if ($healthy) {
            try {
              $body = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 "http://127.0.0.1:8399/welcome").Content
              if ($body -match "Kestrel") { $rendered = $true }
            } catch { }
          }

          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

          if (-not $healthy -or -not $rendered) {
            Write-Host "==> stdout"; if (Test-Path $outLog) { Get-Content $outLog }
            Write-Host "==> stderr"; if (Test-Path $errLog) { Get-Content $errLog }
            $logDir = Join-Path $env:KESTREL_HOME "logs"
            if (Test-Path $logDir) { Write-Host "==> app log"; Get-ChildItem $logDir | ForEach-Object { Get-Content $_.FullName } }
            throw "smoke test failed: healthy=$healthy rendered=$rendered"
          }
          Write-Host "smoke test ok"

      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path dist/Kestrel -DestinationPath dist/Kestrel-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Kestrel-windows
          path: |
            dist/Kestrel
            dist/Kestrel-windows.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-assets-windows
          path: dist/Kestrel-windows.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-assets-windows
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Kestrel-*.dmg
            dist/Kestrel-windows.zip
          generate_release_notes: true
          body: |
            ### macOS

            1. Download `Kestrel-*.dmg` and drag **Kestrel** into Applications.
            2. The bundle is ad-hoc signed, so clear the quarantine flag once:

               ```bash
               xattr -dr com.apple.quarantine /Applications/Kestrel.app
               ```

            Data lives in `~/Library/Application Support/Kestrel`.

            ### Windows

            1. Download `Kestrel-windows.zip` and extract it anywhere.
            2. Run `Kestrel.exe` from the folder.

            Data lives in `%APPDATA%\Kestrel`.

            ### First run

            The app asks three questions — capital, loss per trade, and which markets you trade.
            Nothing leaves your machine.
