  <g class="light">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tileLight)"/>
    <polygon points="779.8,512.0 318.4,315.9 318.4,419.7" fill="#16305C"/>
    <polygon points="779.8,512.0 318.4,460.1 318.4,563.9" fill="#1E63D8"/>
