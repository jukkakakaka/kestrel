  </g>
  <g class="dark">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tileDark)"/>
    <polygon points="779.8,512.0 318.4,315.9 318.4,419.7" fill="#FFFFFF"/>
    <polygon points="779.8,512.0 318.4,460.1 318.4,563.9" fill="#9CC2FF"/>
