<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Kestrel">
  <title>Kestrel</title>
  <defs>
    <linearGradient id="tileLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2ebf8"/>
    </linearGradient>
    <linearGradient id="tileDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262e3c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <style>
    .light { display: inline; } .dark { display: none; }
