[project]
name = "kestrel"
version = "0.1.1"
description = "Multi-market stock scanner and trading journal that keeps you honest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kestrel contributors" }]
keywords = ["trading", "stock", "journal", "scanner", "a-share", "hk-stock", "us-stock"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0", "pystray>=0.19", "pillow>=10.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
kestrel = "kestrel.cli:main"

[project.urls]
Homepage = "https://github.com/jukkakakaka/kestrel"
Issues = "https://github.com/jukkakakaka/kestrel/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrel"]

[tool.hatch.build.targets.sdist]
include = ["src/kestrel", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.pytest_tmp -q"
