{# 记一笔成交的弹窗：台账页和建议页共用。

   只要求四样：代码、方向、数量、价格。市场、名称、手续费、止损目标都由
   /api/journal/fill/suggest 现算，用户随时可以改。 #}
<dialog id="fill-dialog" class="modal">
  <form method="dialog" class="modal-head">
    <h2>{{ t('journal.add_fill') }}</h2>
    <button class="btn ghost sm" value="cancel">{{ t('journal.close') }}</button>
  </form>
  <div class="modal-body">
    <p class="hint" style="margin-bottom:14px;">{{ t('journal.fill_intro') }}</p>

    <div class="grid g2">
      <div class="field" style="grid-column:1 / -1;">
        <label>{{ t('journal.import_col_code') }}</label>
        <input id="fd-code" placeholder="00700 / AAPL / 腾讯" autocomplete="off" list="fd-code-known">
        <datalist id="fd-code-known">
          {% for s in symbols_known %}<option value="{{ s.market }}/{{ s.code }}">{{ s.name }}</option>{% endfor %}
        </datalist>
        <span class="help" id="fd-resolved">{{ t('journal.code_help') }}</span>
      </div>
      <div class="field"><label>{{ t('journal.import_col_side') }}</label>
        <select id="fd-side"><option value="buy">{{ t('journal.side_buy') }}</option><option value="sell">{{ t('journal.side_sell') }}</option></select>
      </div>
      <div class="field"><label>{{ t('journal.qty_shares') }}</label><input id="fd-qty" type="text" inputmode="decimal" placeholder="100"></div>
      <div class="field"><label>{{ t('journal.fill_price') }}</label><input id="fd-price" type="number" step="0.001" placeholder="402.5"></div>
      <div class="field"><label>{{ t('journal.fees_optional') }}</label>
        <input id="fd-fees" type="number" step="0.01" placeholder="0">
        <span class="help" id="fd-fees-hint"></span>
      </div>
      <div class="field"><label>{{ t('journal.fill_date') }}</label><input id="fd-date" type="date"></div>
      <div class="field"><label>{{ t('journal.note') }}</label><input id="fd-note" placeholder="{{ t('journal.fd_note_ph') }}"></div>
    </div>

    <div id="fd-levels" class="notice hidden" style="margin-top:12px;"></div>

    <div class="grid g2" style="margin-top:12px;">
      <div class="field"><label>{{ t('journal.stop_on_buy') }}</label>
        <input id="fd-stop" type="number" step="0.001" placeholder="380">
      </div>
      <div class="field"><label>{{ t('journal.target_on_buy') }}</label>
        <input id="fd-target" type="number" step="0.001" placeholder="440">
      </div>
    </div>
    <p class="tiny muted" id="fd-levels-note"></p>
    <p class="tiny" id="fd-msg" style="min-height:18px;margin-top:8px;"></p>
  </div>
  <div class="modal-foot">
    <button class="btn ghost" id="fd-cancel">{{ t('journal.cancel') }}</button>
    <button class="btn" id="fd-save">{{ t('journal.save_fill') }}</button>
  </div>
</dialog>
