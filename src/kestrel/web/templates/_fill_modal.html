{# 记一笔真实成交弹窗：买入与卖出共用，支持建议与实际对比预演 #}
<dialog id="fill-dialog" class="modal" closedby="any" aria-labelledby="fd-dialog-title">
  <form method="dialog" class="modal-head">
    <div class="modal-title-group">
      <span class="modal-head-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </span>
      <h2 id="fd-dialog-title">{{ t('journal.add_fill') }}</h2>
    </div>
    <button class="wb-icon-btn sm" value="cancel" aria-label="{{ t('journal.close') }}" title="{{ t('journal.close') }}">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
  </form>

  <div class="modal-body">
    <p class="hint" style="margin-bottom:14px;">{{ t('journal.fill_intro') }}</p>

    <div class="grid g2">
      <div class="field" style="grid-column:1 / -1;">
        <label for="fd-code">{{ t('journal.import_col_code') }}</label>
        <input id="fd-code" placeholder="00700 / AAPL / 600519" autocomplete="off" list="fd-code-known">
        <span class="help" id="fd-resolved">{{ t('journal.code_help') }}</span>
      </div>
      <div class="field">
        <label for="fd-side">{{ t('journal.import_col_side') }}</label>
        <select id="fd-side">
          <option value="buy">{{ t('journal.side_buy') }}</option>
          <option value="sell">{{ t('journal.side_sell') }}</option>
        </select>
      </div>
      <div class="field">
        <label for="fd-qty">{{ t('journal.qty_shares') }}</label>
        <input id="fd-qty" type="text" inputmode="decimal" placeholder="100">
      </div>
      <div class="field">
        <label for="fd-price">{{ t('journal.fill_price') }}</label>
        <input id="fd-price" type="number" step="any" placeholder="402.5">
      </div>
      <div class="field">
        <label for="fd-fees">{{ t('journal.fees_optional') }}</label>
        <input id="fd-fees" type="number" step="any" placeholder="{{ t('fill.fees_auto_ph') }}">
        <span class="help" id="fd-fees-hint"></span>
      </div>
      <div class="field">
        <label for="fd-date">{{ t('journal.fill_date') }}</label>
        <input id="fd-date" type="date">
      </div>
      <div class="field">
        <label for="fd-note">{{ t('journal.note') }}</label>
        <input id="fd-note" placeholder="{{ t('journal.fd_note_ph') }}">
      </div>
    </div>

    <p class="tiny muted">{{ t('fill.actual_only') }}</p>
    <div id="fd-preview" class="preview-box hidden"></div>
    <div id="fd-levels" class="notice hidden" style="margin-top:12px;"></div>

    <div id="fd-buy-extras" class="grid g2" style="margin-top:12px;">
      <div class="field">
        <label for="fd-stop">{{ t('journal.stop_on_buy') }}</label>
        <input id="fd-stop" type="number" step="any" placeholder="380">
      </div>
      <div class="field">
        <label for="fd-target">{{ t('journal.target_on_buy') }}</label>
        <input id="fd-target" type="number" step="any" placeholder="440">
      </div>
    </div>

    <div id="fd-sell-extras" class="grid g2 hidden" style="margin-top:12px;">
      <div class="field">
        <label for="fd-exit-reason">{{ t('fill.exit_reason') }}</label>
        <select id="fd-exit-reason">
          <option value="manual">{{ t('fill.reason_manual') }}</option>
          <option value="take_profit">{{ t('fill.reason_tp') }}</option>
          <option value="trailing_stop">{{ t('fill.reason_trail') }}</option>
          <option value="stop_loss">{{ t('fill.reason_sl') }}</option>
          <option value="time_stop">{{ t('fill.reason_time') }}</option>
        </select>
      </div>
      <div class="field" style="justify-content:flex-end;">
        <label class="modal-check-row" style="margin-top:18px;">
          <input type="checkbox" id="fd-rule-break">
          <span>{{ t('j.rule_break') }}</span>
        </label>
      </div>
    </div>

    <p class="tiny muted" id="fd-levels-note" style="margin-top:8px;"></p>
    <p class="tiny" id="fd-msg" role="status" aria-live="polite" style="min-height:18px;margin-top:8px;"></p>
  </div>

  <div class="modal-foot">
    <button type="button" class="btn ghost" id="fd-cancel">{{ t('journal.cancel') }}</button>
    <button type="button" class="btn" id="fd-save">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
      <span>{{ t('journal.save_fill') }}</span>
    </button>
  </div>
</dialog>
